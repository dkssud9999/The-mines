<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100f19">
  <title>The Mine</title>
  <style>
    :root { color-scheme: dark; --ink:#f4efd8; --muted:#aaa7a0; --gold:#f5c766; --panel:#171722; --line:#514b56; --mint:#91efc2; --red:#ff707b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:18px; color:var(--ink); background:radial-gradient(ellipse at 50% 0%,#302b3a 0,#17151f 46%,#0c0b12 100%); font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; }
    button { font:inherit; color:inherit; }
    .shell { width:min(100%,1000px); }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 10px; color:#c9c2b6; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .brand { color:var(--gold); font-weight:900; }
    .gameframe { position:relative; overflow:hidden; border:2px solid #6b5b53; background:#111019; box-shadow:0 0 0 4px #211d27,0 24px 80px #0009; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:16/9; image-rendering:auto; cursor:crosshair; touch-action:none; }
    .viewtools { display:flex; gap:6px; }
    .sound,.fullscreen { border:1px solid #4c4652; border-radius:3px; background:#17151e; padding:7px 10px; cursor:pointer; font-size:11px; }
    .sound:hover,.fullscreen:hover { border-color:var(--gold); }
    .gameframe:fullscreen { width:100vw; height:100vh; height:100dvh; border:0; box-shadow:none; display:grid; place-items:center; background:#090810; }
    .gameframe:fullscreen canvas,.pseudoFullscreen .gameframe canvas { width:min(100vw,177.778vh); height:min(100vh,56.25vw); width:min(100vw,177.778dvh); height:min(100dvh,56.25vw); aspect-ratio:16/9; }
    .pseudoFullscreen { display:block; padding:0; overflow:hidden; }
    .pseudoFullscreen .shell { width:100%; height:100vh; height:100dvh; }
    .pseudoFullscreen .topline,.pseudoFullscreen .footer { display:none; }
    .pseudoFullscreen .gameframe { position:fixed; inset:0; z-index:20; width:100vw; height:100vh; height:100dvh; border:0; box-shadow:none; display:grid; place-items:center; background:#090810; }
    .exitfullscreen { display:none; position:absolute; z-index:5; top:9px; right:9px; padding:7px 10px; border:1px solid #c8c0d0; border-radius:4px; color:#fff4dc; background:#17151ee8; font-size:11px; }
    .gameframe:fullscreen .exitfullscreen,.pseudoFullscreen .exitfullscreen { display:block; }
    .hud { position:absolute; inset:0 0 auto; z-index:2; display:none; justify-content:space-between; align-items:flex-start; gap:16px; padding:13px 16px; pointer-events:none; background:linear-gradient(#0c0b12dc,#0c0b1200); text-shadow:0 2px #111; }
    .hud.visible { display:flex; }
    .hudleft,.hudright { display:grid; gap:6px; min-width:165px; }
    .hudright { text-align:right; justify-items:end; }
    .hudlabel { color:#c2b9aa; font-size:10px; letter-spacing:.12em; }
    .hudval { color:#fff6df; font-size:13px; font-weight:900; }
    .difficultyBadge { padding:4px 7px; border:1px solid #665c4b; border-radius:3px; color:#ffe4a2; background:#14121bd9; font-size:9px; font-weight:900; letter-spacing:.08em; }
    .difficultyBadge.difficulty-0,.difficultyButton.difficulty-0 { --difficulty-color:#b9c2c9; }
    .difficultyBadge.difficulty-1,.difficultyButton.difficulty-1 { --difficulty-color:#91efc2; }
    .difficultyBadge.difficulty-2,.difficultyButton.difficulty-2 { --difficulty-color:#83cfff; }
    .difficultyBadge.difficulty-3,.difficultyButton.difficulty-3 { --difficulty-color:#d69aff; }
    .difficultyBadge[class*="difficulty-"],.difficultyButton[class*="difficulty-"] { border-color:var(--difficulty-color); color:var(--difficulty-color); box-shadow:inset 0 0 10px color-mix(in srgb,var(--difficulty-color) 12%,transparent); }
    .healthbar { width:min(250px,34vw); height:11px; border:2px solid #f2dfb4; background:#291d2a; box-shadow:2px 2px #09080b; }
    .healthfill { height:100%; width:100%; background:linear-gradient(90deg,#e84f67,#ff9b6c); transition:width .12s; }
    .relics { display:flex; gap:5px; justify-content:flex-end; flex-wrap:wrap; max-width:310px; }
    .relicpip { padding:3px 6px; color:#16121a; background:var(--gold); font-size:10px; font-weight:900; border:1px solid #fff0b9; }
    .bossbar { position:absolute; z-index:2; left:20%; right:20%; top:67px; display:none; pointer-events:none; text-align:center; }
    .bossbar.visible { display:block; }
    .bossname { font-size:11px; letter-spacing:.14em; color:#ffe4b5; text-shadow:0 2px #000; margin-bottom:4px; }
    .bosshealth { height:9px; border:2px solid #ffe1b0; background:#25121c; box-shadow:2px 2px #08070a; }
    .bossfill { height:100%; width:100%; background:linear-gradient(90deg,#f05a63,#f39d53); transition:width .1s; }
    .overlay { position:absolute; z-index:4; inset:0; display:none; place-items:center; padding:20px; background:#090810b8; backdrop-filter:blur(3px); }
    .overlay.visible { display:grid; }
    .panel { width:min(100%,620px); max-height:94%; overflow:auto; padding:clamp(18px,4vw,34px); border:2px solid #7a6b63; background:linear-gradient(145deg,#211f2b,#12111a 70%); box-shadow:8px 8px #09080d; text-align:center; }
    .kicker { color:var(--mint); font-size:10px; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:12px 0 10px; color:#ffe4a2; font-size:clamp(27px,6vw,48px); line-height:1; letter-spacing:-.06em; text-shadow:3px 3px #7b3a4c; }
    h2 { margin:9px 0; font-size:clamp(21px,4vw,30px); color:#ffe4a2; }
    .subtitle { color:#d2ccbf; line-height:1.6; font-size:13px; max-width:490px; margin:0 auto 18px; }
    #endText:empty { display:none; }
    .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:15px 0 18px; color:#bdb8b2; font-size:10px; }
    .key { border:1px solid #706873; background:#27232d; padding:5px 8px; box-shadow:0 2px #0b0a10; color:#fff0ca; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:18px; }
    .routeChoices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:20px; }
    .routeCard { display:grid; grid-template-columns:100px minmax(0,1fr); align-items:center; gap:14px; min-height:164px; padding:15px; border:3px solid; color:#17131b; text-align:left; cursor:pointer; box-shadow:5px 5px #09080b; transition:transform .1s,filter .1s; }
    .routeCard:hover { transform:translateY(-3px); filter:brightness(1.12); }
    .routeCard:focus-visible { outline:3px solid #fff; outline-offset:3px; }
    .routeCard.elite { background:#ee5962; border-color:#ffb0a3; }
    .routeCard.shrine { background:#5ba8e8; border-color:#b5e4ff; }
    .routeCard.shop { background:#e8c25b; border-color:#fff0b5; }
    .routeCard.event { background:#a77fe0; border-color:#e2cfff; }
    .routeCard.vein { background:#62c99a; border-color:#c4f5dc; }
    .routeChoices.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .routeChoices.three .routeCard { grid-template-columns:1fr; justify-items:center; text-align:center; gap:8px; }
    .oreText { color:#ffd98a; }
    .card.sold { opacity:.4; pointer-events:none; }
    .card .price { display:block; margin-top:8px; color:#ffd98a; font-weight:bold; }
    .card.cantAfford .price { color:#ff8f8f; }
    .routeIcon { display:grid; place-items:center; width:100px; height:100px; border:3px solid #211b23; background:#f3a52d; box-shadow:3px 3px #211b23; }
    .shrine .routeIcon { background:#75bbf0; }
    .routeIcon svg { display:block; width:76px; height:76px; shape-rendering:crispEdges; }
    .routeText { display:grid; gap:8px; }
    .routeTitle { font-size:15px; font-weight:900; line-height:1.2; }
    .routeDesc { font-size:11px; line-height:1.5; }
    .btn { border:2px solid #f7d58d; background:#b75b58; color:#fff7df; padding:11px 15px; min-width:145px; cursor:pointer; font-weight:900; box-shadow:3px 3px #08070b; transition:transform .1s,filter .1s; }
    .btn:hover { transform:translate(-1px,-2px); filter:brightness(1.14); }
    .btn.secondary { background:#302b39; border-color:#827a84; }
    .btn.green { background:#347d69; border-color:#a5f2cc; }
    .btn:focus-visible { outline:3px solid white; outline-offset:3px; }
    .weaponrow { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:16px auto 4px; }
    .weaponpick { border:1px solid #655d6a; background:#211e29; padding:9px 11px; color:#c9c3c0; cursor:pointer; min-width:120px; }
    .weaponpick.selected { border-color:var(--gold); color:#fff1c7; background:#39303a; }
    .weaponpick:disabled { opacity:.4; cursor:not-allowed; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; }
    .cards.fourCards { grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
    .upgradeCards { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .upgradeCards .card:last-child:nth-child(3) { grid-column:1/-1; width:calc(50% - 5px); justify-self:center; }
    .card { position:relative; display:flex; flex-direction:column; align-items:center; min-height:160px; padding:13px 10px; text-align:center; border:2px solid #675968; background:#211d2a; cursor:pointer; transition:transform .1s,border-color .1s,background .1s; }
    .card.tier-explorer { border-color:#62bfd0; box-shadow:inset 0 0 0 1px #62bfd044; }
    .card.tier-abyss { border-color:#b37aef; box-shadow:inset 0 0 0 1px #b37aef55,0 0 12px #713ca322; }
    .card.tier-collapse { border-color:#ff725f; box-shadow:inset 0 0 0 1px #ff725f66,0 0 16px #ff453322; }
    .card[class*="tier-"] { padding-bottom:28px; }
    .card:hover { transform:translateY(-4px); border-color:#f6cf74; background:#302637; }
    .cardicon { font-size:26px; margin:0 0 8px; }
    .lootPanel { width:min(100%,720px); }
    .lootPanel.fourItems { width:min(100%,900px); }
    .comboTag { display:block; margin-top:10px; color:#9de8d9; font-size:10px; line-height:1.6; }
    .synergyDetails { margin-top:14px; padding:10px 12px; border:1px solid #4b6159; border-radius:5px; background:#0e1619; text-align:left; color:#c6ddd3; font-size:11px; line-height:1.8; }
    .synergyDetails summary { cursor:pointer; color:#a7efbf; }
    .synergyDetails p { margin:10px 0 0; }
    .synergyDetails strong { color:#f5dfaa; }
    .relicImage { display:block; width:70px; height:70px; margin:0 auto 8px; object-fit:contain; image-rendering:pixelated; }
    #lootCards .card { min-height:184px; }
    #lootCards.fourCards .relicImage { width:64px; height:64px; }
    #lootCards .revealCard { opacity:0; animation:lootCardReveal .22s steps(3,end) var(--reveal-delay,0s) both; }
    @keyframes lootCardReveal { from { opacity:0; transform:translateY(10px) scale(.92); } to { opacity:1; transform:translateY(0) scale(1); } }
    .cardname { color:#ffe4a2; font-size:12px; font-weight:900; margin-bottom:6px; }
    .carddesc { color:#c4bdba; font-size:10px; line-height:1.45; }
    .tierBadge { position:absolute; right:6px; bottom:6px; padding:3px 5px; border:1px solid currentColor; background:#17131bef; font-size:8px; font-weight:900; letter-spacing:.04em; }
    .tier-explorer .tierBadge { color:#79d7e7; }
    .tier-abyss .tierBadge { color:#c69aff; }
    .tier-collapse .tierBadge { color:#ff8573; }
    .cardrare { margin-top:auto; padding-top:8px; color:var(--mint); font-size:9px; letter-spacing:.12em; }
    .smallnote { margin-top:13px; color:#9d9898; font-size:10px; line-height:1.5; }
    .statline { display:flex; justify-content:center; flex-wrap:wrap; gap:18px; margin:18px 0; color:#d6cfc4; font-size:11px; }
    .statline b { color:#ffe4a2; }
    .toast { position:absolute; z-index:3; left:50%; top:24%; transform:translate(-50%,-8px); opacity:0; padding:8px 12px; border:1px solid #f7d58d; color:#fff1c7; background:#17131be8; font-size:11px; pointer-events:none; transition:opacity .18s,transform .18s; white-space:nowrap; }
    .toast.visible { opacity:1; transform:translate(-50%,0); }
    .footer { display:flex; justify-content:space-between; gap:12px; margin:10px 2px 0; color:#89848a; font-size:10px; }
    @media(max-width:620px) { body{padding:6px}.hud{padding:8px}.hudleft,.hudright{min-width:0}.hudval{font-size:11px}.hudlabel{font-size:8px}.bossbar{top:64px;left:13%;right:13%}.cards{gap:5px}.cards.fourCards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:9px 6px;min-height:153px}.carddesc{font-size:9px}.panel{padding:17px 12px}.footer{font-size:9px} }
    @media(max-width:620px) { .routeChoices{gap:8px}.routeCard{grid-template-columns:1fr;justify-items:center;gap:8px;min-height:170px;padding:10px 6px;text-align:center}.routeIcon{width:58px;height:58px}.routeIcon svg{width:44px;height:44px}.routeText{gap:5px}.routeTitle{font-size:12px}.routeDesc{font-size:9px} }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline"><span class="brand">✦ The Mine</span><div class="viewtools"><button class="sound" id="soundToggle" type="button">♫ 소리 켜짐</button><button class="fullscreen" id="fullscreenToggle" type="button">⛶ 전체 화면</button></div></div>
    <div class="gameframe" id="gameframe">
      <canvas id="game" width="960" height="540" aria-label="지하 유적 보스 로그라이크 게임 화면"></canvas>
      <button class="exitfullscreen" id="exitFullscreenButton" type="button">화면 복귀</button>
      <div class="hud" id="hud">
        <div class="hudleft"><div class="hudlabel">체력 <span id="hpText">100 / 100</span></div><div class="healthbar"><div class="healthfill" id="healthFill"></div></div><div class="hudval" id="weaponHud">부메랑 도끼</div><div class="hudlabel" id="xpText">유물 경험치 0 / 6</div><div class="hudlabel oreText" id="oreText">광석 0</div></div>
        <div class="hudright"><div class="difficultyBadge" id="difficultyHud">난이도 · 광부</div><div class="hudlabel" id="zoneHud">구역 1 · 갱도의 입구</div><div class="hudval" id="roomHud">전투</div><div class="relics" id="relicHud"></div><div class="hudlabel" id="recordHud"></div></div>
      </div>
      <div class="bossbar" id="bossbar"><div class="bossname" id="bossName"></div><div class="bosshealth"><div class="bossfill" id="bossFill"></div></div></div>
      <div class="toast" id="toast"></div>
      <section class="overlay visible" id="titleOverlay"><div class="panel">
        <h1>The Mine</h1>
        <div class="weaponrow" id="weaponSelect"></div>
        <div class="controls"><span class="key" id="moveHelp">W A S D 이동</span><span class="key" id="aimHelp">마우스 조준</span><span class="key" id="attackHelp">도끼: 눌러 모으고 놓기 · 지팡이/낫: 누르고 공격</span><span class="key" id="dashHelp">SPACE 대시</span><span class="key" id="pauseHelp">ESC 일시정지</span></div>
        <div class="smallnote" id="unlockNote"></div><div class="smallnote" id="difficultyNote"></div>
        <div class="actions"><button class="btn" id="startButton" type="button">광산에 들어가기</button><button class="btn secondary" id="difficultyButton" type="button">난이도 · 광부</button></div>
        <button class="btn secondary" id="balanceExportButton" type="button" hidden>판 기록 JSON 내려받기</button>
      </div></section>
      <section class="overlay" id="choiceOverlay"><div class="panel">
        <div class="routeChoices" id="routeChoices"></div>
      </div></section>
      <section class="overlay" id="lootOverlay"><div class="panel lootPanel" id="lootPanel">
        <div class="kicker" id="lootKicker">상자 개방</div><h2 id="lootTitle">하나를 골라라</h2><p class="subtitle" id="lootSubtitle">획득할 유물을 고르세요.</p>
        <div class="cards" id="lootCards"></div><div class="actions" id="lootActions"></div><div class="smallnote" id="synergyHint"></div><details class="synergyDetails" id="synergyDetails" hidden></details>
      </div></section>
      <section class="overlay" id="weaponUpgradeOverlay"><div class="panel">
        <div class="kicker">무기 각성</div><h2 id="weaponUpgradeTitle">무기의 길을 골라라</h2><p class="subtitle">강화 하나를 고르세요. 이번 탐험 동안 유지됩니다.</p>
        <div class="cards upgradeCards" id="weaponUpgradeCards"></div>
      </div></section>
      <section class="overlay" id="pauseOverlay"><div class="panel"><h2>일시정지</h2><div class="actions"><button class="btn green" id="resumeButton" type="button">계속하기</button><button class="btn secondary" id="quitButton" type="button">광산에서 나가기</button></div></div></section>
      <section class="overlay" id="endOverlay"><div class="panel"><div class="kicker" id="endKicker">RUN OVER</div><h2 id="endTitle">탐험 종료</h2><p class="subtitle" id="endText"></p><div class="statline" id="endStats"></div><p class="smallnote" id="balanceEndNote" hidden></p><div class="actions" id="endActions"></div></div></section>
    </div>
    <div class="footer"><span id="footerHint">브라우저에 기록 저장</span></div>
  </main>
<script>
(() => {
  'use strict';
  const W=960,H=540, canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const renderScale=2;canvas.width=W*renderScale;canvas.height=H*renderScale;ctx.setTransform(renderScale,0,0,renderScale,0,0);
  const razorOrbitRadius=160;
  const $=id=>document.getElementById(id);
  const enemySpriteAtlas=new Image();enemySpriteAtlas.src='assets/enemy-sprites-v4.png';

  const playerWalkAtlas=new Image();playerWalkAtlas.src='assets/player-walk-v2.png';
  const playerWalkPixels=new Map();
  const playerWeaponAtlas=new Image();playerWeaponAtlas.src='assets/player-weapons-v1.png';
  const playerWeaponPixels=new Map();
  let playerPixelSprite=null;
  const enemyPixelSprites=new Map();
  const enemyAnimationBounds={
    'boss-moth':[[28,176,515,447],[543,168,543,455],[1086,176,543,447],[1629,174,517,449]],
    'boss-star':[[10,124,507,495],[518,70,517,595],[1036,154,497,439],[1564,124,497,495]],

    'enemy-brother-right':[[20,130,511,463],[557,98,519,475],[1096,106,521,481],[1641,130,511,463]],
    'enemy-geode':[[46,158,497,425],[543,158,527,425],[1100,154,507,429],[1639,168,513,415]],
    'enemy-maw':[[18,112,511,495],[561,112,507,495],[1104,112,507,495],[1647,114,509,493]],
    'enemy-mushroom':[[34,232,509,403],[543,196,519,439],[1112,128,517,507],[1629,220,531,415]],
    'enemy-seal':[[38,124,467,445],[577,112,473,449],[1126,124,465,445],[1667,124,469,445]],
    'enemy-slime':[[24,238,497,397],[557,354,521,283],[1130,148,445,493],[1641,266,511,375]]
  };
  const overlays=['titleOverlay','choiceOverlay','lootOverlay','weaponUpgradeOverlay','pauseOverlay','endOverlay'];
  const FINAL_STAGE=4;
  const names=['','녹슨 갱도','수정층의 심장','잿빛 용광로','별똥별 성소'];
  const bosses=[
    {name:'녹슨 수호자',color:'#e46d63',kind:'warden'},
    {name:'수정 나방',color:'#9d82f3',kind:'moth'},
    {name:'용광로 거인',color:'#ff8a3d',kind:'forge'},
    {name:'별의 핵',color:'#5ed9d1',kind:'star'}
  ];
  const bossPatterns={
    starter:{warden:['charge','aimed','radial','aimed'],moth:['feather','fan','split','ring','summon'],star:['ring','aimed','gigablast','fan','charge','wall']},
    full:{warden:['charge','radial','aimed','charge','wall','aimed'],moth:['feather','split','beam','fan','target','summon','ring'],star:['ring','aimed','gigablast','spiral','fan','charge','wall','beam']},
    abyss:{warden:['wall','aimed','charge','radial','wall','charge','aimed','radial','target','charge'],moth:['target','split','beam','feather','ring','target','fan','beam','summon','split','target'],star:['wall','spiral','charge','aimed','beam','fan','wall','gigablast','spiral','charge']},

  $('fullscreenToggle').addEventListener('click',async()=>{if(document.fullscreenElement){await document.exitFullscreen?.();}else if(document.body.classList.contains('pseudoFullscreen')){document.body.classList.remove('pseudoFullscreen');$('fullscreenToggle').textContent='⛶ 전체 화면';}else await enterFullscreen();});
  document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;document.body.classList.toggle('pseudoFullscreen',false);$('fullscreenToggle').textContent=full?'⤢ 화면 복귀':'⛶ 전체 화면';});
  $('exitFullscreenButton').addEventListener('click',async()=>{if(document.fullscreenElement)await document.exitFullscreen?.();else{document.body.classList.remove('pseudoFullscreen');$('fullscreenToggle').textContent='⛶ 전체 화면';}});
  function startAudio(){if(!window.AudioContext&&!window.webkitAudioContext)return;if(audio){if(audio.state==='suspended')audio.resume();return;}const AC=window.AudioContext||window.webkitAudioContext;audio=new AC();if(audio.state==='suspended')audio.resume();musicStep=0;clearInterval(musicTimer);musicTimer=setInterval(()=>{if(!soundOn||!audio)return;const seq=[196,0,247,0,294,247,0,165,0,196,0,147,165,0,220,0];const f=seq[musicStep++%seq.length];if(f)tone(f,.12,'triangle',.025);},220);}
  function unlockAudio(){if(soundOn)startAudio();}
  window.addEventListener('pointerdown',e=>{if((e.pointerType==='touch'||e.pointerType==='pen')&&!touchMode){touchMode=true;syncWeaponPicker();}else if(e.pointerType==='mouse'&&touchMode){touchMode=false;syncWeaponPicker();}},true);window.addEventListener('pointerdown',unlockAudio,{once:true});window.addEventListener('keydown',unlockAudio,{once:true});
  function tone(freq,duration,wave='square',volume=.04){if(!soundOn||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}
  let parryClangAudio=null;
  function playParryClang(){if(!soundOn)return;if(!parryClangAudio){parryClangAudio=new Audio('assets/sfx/parry-clang.wav');parryClangAudio.preload='auto';parryClangAudio.volume=.385;parryClangAudio.playbackRate=1.08;}parryClangAudio.currentTime=0;parryClangAudio.play().catch(()=>{});}
  function playRelicBlastSound(){if(!soundOn||!audio)return;const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(96,now);osc.frequency.exponentialRampToValueAtTime(38,now+.26);gain.gain.setValueAtTime(.13,now);gain.gain.exponentialRampToValueAtTime(.001,now+.3);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.31);const length=Math.ceil(audio.sampleRate*.12),buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),noiseGain=audio.createGain();noise.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(520,now);noiseGain.gain.setValueAtTime(.07,now);noiseGain.gain.exponentialRampToValueAtTime(.001,now+.12);noise.connect(filter);filter.connect(noiseGain);noiseGain.connect(audio.destination);noise.start(now);noise.stop(now+.12);}
  function playSound(type){if(type==='relicBlast'){playRelicBlastSound();return;}if(type==='parryHit'){playParryClang();return;}const map={start:[330,.14,'square',.04],shot:[620,.05,'square',.018],charge:[390,.09,'triangle',.018],enemyShot:[190,.045,'sine',.012],hurt:[110,.16,'sawtooth',.055],dash:[430,.12,'triangle',.025],parry:[720,.08,'triangle',.035],parryHit:[1040,.12,'sine',.06],kill:[240,.07,'square',.02],boss:[90,.35,'sawtooth',.04],bossDown:[75,.5,'triangle',.07],chest:[740,.16,'triangle',.045],relic:[520,.2,'sine',.045],heal:[440,.24,'sine',.03],death:[65,.5,'sawtooth',.06],win:[660,.45,'triangle',.05]};const v=map[type];if(v)tone(...v);}
  syncWeaponPicker();requestAnimationFrame(loop);
})();
